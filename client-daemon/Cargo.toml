[package]
name = "client-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.37", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"

# Serialization & Web
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Ethereum Cryptography & EIP-712
alloy-primitives = { version = "0.7", features = ["serde"] }
alloy-sol-types = { version = "0.7", features = ["eip712-serde", "json"] }
alloy-signer = "0.1"
alloy-signer-local = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
hex = "0.4"
rand = "0.8"

# Logging & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.6"

[dev-dependencies]
tokio-test = "0.4"
